
# ==========================================
# Application
# ==========================================
spring.application.name=rag-ecommerce-support


# ==========================================
# OpenRouter - Chat & Embeddings
# ==========================================
# OpenRouter provides an OpenAI-compatible API
spring.ai.openai.base-url=https://openrouter.ai/api

# Your OpenRouter API key
spring.ai.openai.api-key=${OPENROUTER_API_KEY}

# Chat model
spring.ai.openai.chat.model=openai/gpt-4o-mini

# Embedding model
spring.ai.openai.embedding.options.model=openai/text-embedding-3-small

# Embedding dimensions
spring.ai.openai.embedding.options.dimensions=1024


# ==========================================
# Pinecone - Vector Database
# ==========================================
# Your Pinecone API key
spring.ai.vectorstore.pinecone.api-key=pcsk_5U96Ki_BQhegMitVJ5npFudf82H6DKrbQ97ovViDLrg8D9B9nPYRqsbMerHAS8zCanRQEY

# Your existing Pinecone index
spring.ai.vectorstore.pinecone.index-name=shop-support

# Namespace for your documents
spring.ai.vectorstore.pinecone.namespace=policies
